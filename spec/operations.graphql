# Mina SDK common API: the GraphQL documents of the public daemon API
# (port 3085) that the Mina SDKs send.
#
# This file and SPEC.md are the specification (o1-labs/mina-sdk-spec). Each
# SDK keeps a copy at a pinned tag (spec/VERSION) and a test that its query
# strings are these documents, up to white space. CI in this repository
# validates the documents against schema/daemon.graphql and against live
# daemons. Change the documents here first, then in every SDK.
#
# Rules:
# - One named operation per method. The SDKs send the operation name too.
# - Nullable variables are always sent, as null when the caller omits them:
#   the daemon rejects a declared variable that is absent from the request.
# - Where the SDKs had different selections, this is their union.

query SyncStatus {
  syncStatus
}

query DaemonStatus {
  daemonStatus {
    syncStatus
    blockchainLength
    highestBlockLengthReceived
    highestUnvalidatedBlockLengthReceived
    uptimeSecs
    stateHash
    commitId
    numAccounts
    ledgerMerkleRoot
    chainId
    catchupStatus
    blockProductionKeys
    coinbaseReceiver
    globalSlotSinceGenesisBestTip
    consensusTimeNow {
      epoch
      slot
      globalSlot
      startTime
      endTime
    }
    peers {
      peerId
      host
      libp2pPort
    }
    addrsAndPorts {
      externalIp
      bindIp
      clientPort
      libp2pPort
      peer {
        host
        libp2pPort
        peerId
      }
    }
  }
}

query DaemonMetrics {
  daemonStatus {
    metrics {
      blockProductionDelay
      transactionPoolDiffReceived
      transactionPoolDiffBroadcasted
      transactionsAddedToPool
      transactionPoolSize
      snarkPoolDiffReceived
      snarkPoolDiffBroadcasted
      pendingSnarkWork
      snarkPoolSize
    }
  }
}

query NetworkId {
  networkID
}

query Account($publicKey: PublicKey!, $token: TokenId) {
  account(publicKey: $publicKey, token: $token) {
    publicKey
    nonce
    delegate
    tokenId
    tokenSymbol
    votingFor
    receiptChainHash
    balance {
      total
      liquid
      locked
      blockHeight
    }
    timing {
      initialMinimumBalance
      cliffTime
      cliffAmount
      vestingPeriod
      vestingIncrement
    }
    permissions {
      editState
      send
      receive
      access
      setDelegate
      setPermissions
      setVerificationKey {
        auth
        txnVersion
      }
      setZkappUri
      editActionState
      setTokenSymbol
      incrementNonce
      setVotingFor
      setTiming
    }
    zkappState
    provedState
    zkappUri
  }
}

query BestChain($maxLength: Int) {
  bestChain(maxLength: $maxLength) {
    stateHash
    commandTransactionCount
    creatorAccount {
      publicKey
    }
    protocolState {
      previousStateHash
      consensusState {
        blockHeight
        epoch
        slot
        slotSinceGenesis
        blockCreator
        coinbaseReceiever
        stakingEpochData {
          epochLength
          seed
          ledger {
            hash
          }
        }
        nextEpochData {
          seed
          ledger {
            hash
          }
        }
      }
      blockchainState {
        date
        utcDate
        snarkedLedgerHash
        stagedLedgerHash
      }
    }
    snarkJobs {
      prover
      fee
      workIds
    }
    transactions {
      coinbase
      coinbaseReceiverAccount {
        publicKey
      }
      feeTransfer {
        recipient
        fee
        type
      }
      userCommands {
        id
        hash
        kind
        nonce
        source {
          publicKey
        }
        receiver {
          publicKey
        }
        amount
        fee
        memo
        failureReason
      }
      zkappCommands {
        id
        hash
        failureReason {
          index
          failures
        }
        zkappCommand {
          memo
          feePayer {
            authorization
            body {
              publicKey
              fee
              nonce
              validUntil
            }
          }
          accountUpdates {
            authorization {
              signature
              proof
            }
            body {
              publicKey
              tokenId
              callDepth
              callData
              actions
              events
              incrementNonce
              useFullCommitment
              implicitAccountCreationFee
              balanceChange {
                magnitude
                sgn
              }
              mayUseToken {
                parentsOwnToken
                inheritFromParent
              }
              authorizationKind {
                isSigned
                isProved
                verificationKeyHash
              }
              update {
                appState
                delegate
                zkappUri
                votingFor
                tokenSymbol
                verificationKey {
                  hash
                  data
                }
                timing {
                  initialMinimumBalance
                  cliffTime
                  cliffAmount
                  vestingPeriod
                  vestingIncrement
                }
                permissions {
                  editState
                  send
                  receive
                  access
                  setDelegate
                  setPermissions
                  setVerificationKey {
                    auth
                    txnVersion
                  }
                  setZkappUri
                  editActionState
                  setTokenSymbol
                  incrementNonce
                  setVotingFor
                  setTiming
                }
              }
              preconditions {
                validWhile {
                  lower
                  upper
                }
                network {
                  snarkedLedgerHash
                  blockchainLength {
                    lower
                    upper
                  }
                  minWindowDensity {
                    lower
                    upper
                  }
                  totalCurrency {
                    lower
                    upper
                  }
                  globalSlotSinceGenesis {
                    lower
                    upper
                  }
                  stakingEpochData {
                    seed
                    startCheckpoint
                    lockCheckpoint
                    epochLength {
                      lower
                      upper
                    }
                    ledger {
                      hash
                      totalCurrency {
                        lower
                        upper
                      }
                    }
                  }
                  nextEpochData {
                    seed
                    startCheckpoint
                    lockCheckpoint
                    epochLength {
                      lower
                      upper
                    }
                    ledger {
                      hash
                      totalCurrency {
                        lower
                        upper
                      }
                    }
                  }
                }
                account {
                  balance {
                    lower
                    upper
                  }
                  nonce {
                    lower
                    upper
                  }
                  receiptChainHash
                  delegate
                  state
                  actionState
                  provedState
                  isNew
                }
              }
            }
          }
        }
      }
    }
  }
}

